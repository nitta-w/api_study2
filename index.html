<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>今のお天気を取得</title>
	<link rel="stylesheet" href="css/style.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700;900&display=swap" rel="stylesheet">

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="js/script.js"></script>
</head>
<body>
	<main>
		<h1>あの日あの時<span>お天気LOG☁️</span></h1>

		<div class="day">
			<div class="question">①いつの天気が知りたいのかな？</div>
			<div>
				<input type="date" name="select_day">
			</div>
		</div>

		<div class="place">
			<div class="question">②知りたい場所はどこかな？</div>
			<ul>
				<li><label for="select_place_ebisu"><input type="radio" name="select_place" id="select_place_ebisu" value="data3">恵比寿</label></li>
				<li><label for="select_place_osaka"><input type="radio" name="select_place" id="select_place_osaka" value="data2">サポート本社</label></li>
				<li><label for="select_place_nitta"><input type="radio" name="select_place" id="select_place_nitta" value="data1">新田上空</label></li>
			</ul>
		</div>

		<div class="item">
			<div class="question">③知りたい項目は何かな？（2つまでだよ）</div>
			<ul>
				<li><label for="select_item_temp"><input type="checkbox" name="select_item" id="select_item_temp" value="temp">気温</label></li>
				<li><label for="select_item_humi"><input type="checkbox" name="select_item" id="select_item_humi" value="humi">湿度</label></li>
				<li><label for="select_item_press"><input type="checkbox" name="select_item" id="select_item_press" value="press">気圧</label></li>
			</ul>
		</div>

		<div class="btn-area">
			<button class="js-click-btn">結果を表示してね</button>
		</div>

		<div class="result">
			<div class="js-result-name result-name">結果はここに表示されるよ〜</div>
			<div class="result__weather">
				<div><img src=""  class="js-result-icon" alt=""></div>
				<div class="js-result-temp result__temp"></div>
			</div>
		</div>

	</main>
</body>
</html>
